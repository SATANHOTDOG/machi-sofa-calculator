        { sku: "014422271", name: "伊登麻吉模組沙發 左扶手 窄", color: "貓抓亞麻綠", price: 15900 },
        { sku: "014422272", name: "伊登麻吉模組沙發 右扶手 窄", color: "貓抓亞麻綠", price: 15900 },
        { sku: "014422273", name: "伊登麻吉模組沙發 兩人座", color: "貓抓亞麻綠", price: 28990 },
        { sku: "014422274", name: "伊登麻吉模組沙發 一字型", color: "貓抓亞麻綠", price: 34990 },
        { sku: "014422275", name: "伊登麻吉模組沙發 左右轉角", color: "貓抓亞麻綠", price: 13900 },
        { sku: "014422276", name: "伊登麻吉模組沙發 單人座", color: "貓抓亞麻綠", price: 9900 },
        { sku: "014422277", name: "伊登麻吉模組沙發 腳凳", color: "貓抓亞麻綠", price: 6900 },
        { sku: "014422278", name: "伊登麻吉模組沙發 左扶手 寬", color: "貓抓亞麻綠", price: 16900 },
        { sku: "014422279", name: "伊登麻吉模組沙發 右扶手 寬", color: "貓抓亞麻綠", price: 16900 },
        { sku: "014422280", name: "伊登麻吉模組沙發 三人座", color: "貓抓亞麻綠", price: 29990 },
        { sku: "014422281", name: "伊登麻吉模組沙發 一字型", color: "平紋藍", price: 34990 }
    ];

    const uniqueColors = [...new Set(database.map(item => item.color))];
    const orderLinesContainer = document.getElementById('orderLines');
    const grandTotalElement = document.getElementById('grandTotal');
    const layoutArea = document.getElementById('layoutArea');
    const previewWrapper = document.getElementById('previewWrapper');
    const previewFooter = document.getElementById('previewFooter');
    const dimDisplay = document.getElementById('dimDisplay');

    let initialDrawDir = 0; 
    document.querySelectorAll('.compass-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.compass-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            initialDrawDir = parseInt(this.getAttribute('data-dir'));
            calculateTotals(); 
        });
    });

    const scale = 0.9; 
    const moduleDefs = {
        "左扶手 窄": { label: "左扶手窄", w: 96, h: 99, type: 'arm' },
        "右扶手 窄": { label: "右扶手窄", w: 96, h: 99, type: 'arm' },
        "左扶手 寬": { label: "左扶手寬", w: 115, h: 99, type: 'arm' },
        "右扶手 寬": { label: "右扶手寬", w: 115, h: 99, type: 'arm' },
        "單人座": { label: "單人座", w: 96, h: 99, type: 'seat' },
        "轉角": { label: "轉角", w: 95, h: 95, type: 'corner' },
        "左右轉角": { label: "轉角", w: 95, h: 95, type: 'corner' },
        "腳凳": { label: "腳凳", w: 106, h: 96, type: 'ottoman' }
    };

    function formatCurrency(num) { return num.toLocaleString('en-US'); }
    function parseItemName(name) {
        for (const key in moduleDefs) { if (name.includes(key)) return moduleDefs[key]; }
        return null;
    }

    let draggingRow = null;
    orderLinesContainer.addEventListener('dragstart', e => {
        if (e.target.classList.contains('item-row')) { draggingRow = e.target; setTimeout(() => e.target.classList.add('dragging'), 0); }
    });
    orderLinesContainer.addEventListener('dragend', e => {
        if (e.target.classList.contains('item-row')) { e.target.classList.remove('dragging'); draggingRow = null; calculateTotals(); }
    });
    orderLinesContainer.addEventListener('dragover', e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(orderLinesContainer, e.clientY);
        if (draggingRow) {
            if (afterElement == null) orderLinesContainer.appendChild(draggingRow);
            else orderLinesContainer.insertBefore(draggingRow, afterElement);
        }
    });

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.item-row:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
            else return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function renderAbsoluteLayout(items) {
        layoutArea.innerHTML = '';
        if (items.length === 0) { 
            previewWrapper.style.display = 'none'; 
            previewFooter.style.display = 'none';
            return; 
        }
        previewWrapper.style.display = 'flex';
        previewFooter.style.display = 'block';

        let mainList = []; let allBlocks = []; let cx = 0, cy = 0; let dir = initialDrawDir;

        for (let i = 0; i < items.length; i++) {
            let def = parseItemName(items[i].name);
            if (def && def.type !== 'ottoman') {
                let drawW = (dir % 2 !== 0) ? def.h : def.w;
                let drawH = (dir % 2 !== 0) ? def.w : def.h;
                
                let x = 0, y = 0;
                if (dir === 0) { x = cx; y = cy; } 
                else if (dir === 1) { x = cx - drawW; y = cy; } 
                else if (dir === 2) { x = cx - drawW; y = cy - drawH; } 
                else if (dir === 3) { x = cx; y = cy - drawH; } 
                
                let block = { ...def, origIndex: i, x: x, y: y, drawW: drawW, drawH: drawH, placedDir: dir };
                mainList.push(block); allBlocks.push(block);
                
                if (def.type === 'corner') {
                    let prevDir = dir; dir = (dir + 1) % 4; 
                    if (prevDir === 0) { cx = x + def.w; cy = y + def.h; }
                    else if (prevDir === 1) { cx = x; cy = y + def.h; }
                    else if (prevDir === 2) { cx = x; cy = y; }
                    else if (prevDir === 3) { cx = x + def.w; cy = y; }
                } else {
                    if (dir === 0) cx += drawW; else if (dir === 1) cy += drawH; else if (dir === 2) cx -= drawW; else if (dir === 3) cy -= drawH;
                }
            }
        }

        for (let i = 0; i < items.length; i++) {
            let def = parseItemName(items[i].name);
            if (def && def.type === 'ottoman') {
                let target = null;
                for (let b = i - 1; b >= 0; b--) { target = mainList.find(m => m.origIndex === b); if (target) break; }
                if (!target) { for (let f = i + 1; f < items.length; f++) { target = mainList.find(m => m.origIndex === f); if (target) break; } }
                
                if (target) {
                    let ow = def.w, oh = def.h;
                    if (target.placedDir % 2 !== 0) { ow = def.h; oh = def.w; }
                    let ox = target.x, oy = target.y;
                    if (target.placedDir === 0) { oy = target.y + target.drawH; ox = target.x + (target.drawW - ow) / 2; }
                    else if (target.placedDir === 1) { ox = target.x - ow; oy = target.y + (target.drawH - oh) / 2; }
                    else if (target.placedDir === 2) { oy = target.y - oh; ox = target.x + (target.drawW - ow) / 2; }
                    else if (target.placedDir === 3) { ox = target.x + target.drawW; oy = target.y + (target.drawH - oh) / 2; }
                    allBlocks.push({ ...def, x: ox, y: oy, drawW: ow, drawH: oh, type: 'ottoman' });
                } else {
                    allBlocks.push({ ...def, x: 0, y: 0, drawW: def.w, drawH: def.h, type: 'ottoman' });
                }
            }
        }

        if(allBlocks.length > 0) {
            let minX = Math.min(...allBlocks.map(b => b.x)); let minY = Math.min(...allBlocks.map(b => b.y));
            let maxX = Math.max(...allBlocks.map(b => b.x + b.drawW)); let maxY = Math.max(...allBlocks.map(b => b.y + b.drawH));
            
            let totalW = maxX - minX; let totalH = maxY - minY;
            
            layoutArea.style.width = (totalW * scale) + 'px'; layoutArea.style.height = (totalH * scale) + 'px';
            dimDisplay.innerHTML = `🚨 組合空間總尺寸：寬 ${totalW} cm × 深 ${totalH} cm`;

            allBlocks.forEach(b => {
                const div = document.createElement('div');
                div.className = `sofa-module ${b.type}`;
                div.style.width = (b.drawW * scale) + 'px'; div.style.height = (b.drawH * scale) + 'px';
                div.style.left = ((b.x - minX) * scale) + 'px'; div.style.top = ((b.y - minY) * scale) + 'px';
                div.innerHTML = `${b.label}<div class="module-desc">${b.drawW}x${b.drawH}</div>`;
                layoutArea.appendChild(div);
            });
        }
    }

    function calculateTotals() {
        let total = 0; let layoutItems = []; 
        const subtotals = document.querySelectorAll('.subtotal-input'); const rows = document.querySelectorAll('.item-row');
        
        rows.forEach((row, index) => {
            const val = parseInt(subtotals[index].value.replace(/,/g, '')) || 0; total += val;
            const select = row.querySelector('.product-select'); const qtyInput = row.querySelector('.qty-input');
            const qty = parseInt(qtyInput.value) || 0;
            if(select.value && qty > 0) {
                const name = select.options[select.selectedIndex].text;
                for(let i=0; i<qty; i++) layoutItems.push({name: name});
            }
        });
        
        grandTotalElement.textContent = formatCurrency(total); renderAbsoluteLayout(layoutItems); 
    }

    function moveRow(btn, direction) {
        const row = btn.closest('.item-row');
        if (direction === 'up' && row.previousElementSibling) { row.parentNode.insertBefore(row, row.previousElementSibling); calculateTotals(); } 
        else if (direction === 'down' && row.nextElementSibling) { row.parentNode.insertBefore(row.nextElementSibling, row); calculateTotals(); }
    }

    document.getElementById('addBtn').addEventListener('click', createRow);

    function createRow() {
        const row = document.createElement('div');
        row.className = 'item-row'; row.draggable = true;
        let colorOptions = '<option value="">選擇顏色...</option>';
        uniqueColors.forEach(color => { colorOptions += `<option value="${color}">${color}</option>`; });

        row.innerHTML = `
            <div class="form-group"><label>☰ 顏色</label><select class="color-select">${colorOptions}</select></div>
            <div class="form-group large"><label>商品名稱</label><select class="product-select" disabled><option value="">請選擇...</option></select></div>
            <div class="form-group"><label>SKU 貨號</label><input type="text" class="sku-input" readonly placeholder="自動帶入"></div>
            <div class="form-group"><label>單價</label><input type="text" class="price-input" readonly placeholder="0"></div>
            <div class="form-group small"><label>數量</label><input type="number" class="qty-input" value="1" min="1" disabled></div>
            <div class="form-group"><label>小計</label><input type="text" class="subtotal-input" readonly placeholder="0"></div>
            <div class="action-group">
                <div class="action-row"><button class="btn-icon" onclick="moveRow(this, 'up')">🔼</button><button class="btn-icon" onclick="moveRow(this, 'down')">🔽</button></div>
                <button class="btn-icon btn-delete" type="button">✖</button>
            </div>
        `;

        const colorSelect = row.querySelector('.color-select'); const productSelect = row.querySelector('.product-select');
        const skuInput = row.querySelector('.sku-input'); const priceInput = row.querySelector('.price-input');
        const qtyInput = row.querySelector('.qty-input'); const subtotalInput = row.querySelector('.subtotal-input');
        const removeBtn = row.querySelector('.btn-delete');

        function resetRowFields() { skuInput.value = ''; priceInput.value = ''; qtyInput.value = '1'; qtyInput.disabled = true; subtotalInput.value = ''; calculateTotals(); }

        colorSelect.addEventListener('change', function() {
            const selectedColor = this.value; productSelect.innerHTML = '<option value="">請選擇...</option>'; resetRowFields();
            if (selectedColor) {
                productSelect.disabled = false;
                database.filter(item => item.color === selectedColor).forEach(product => {
                    const option = document.createElement('option'); option.value = product.sku; option.textContent = product.name; productSelect.appendChild(option);
                });
            } else { productSelect.disabled = true; }
        });

        productSelect.addEventListener('change', function() {
            if (this.value) {
                qtyInput.disabled = false; qtyInput.value = 1; const product = database.find(item => item.sku === this.value);
                skuInput.value = product.sku; priceInput.value = formatCurrency(product.price); subtotalInput.value = formatCurrency(product.price); calculateTotals();
            } else { resetRowFields(); }
        });

        qtyInput.addEventListener('input', function() {
            if (productSelect.value) {
                const product = database.find(item => item.sku === productSelect.value);
                subtotalInput.value = formatCurrency(product.price * (parseInt(this.value) || 0)); calculateTotals();
            }
        });

        removeBtn.addEventListener('click', function() {
            if (document.querySelectorAll('.item-row').length > 1) { row.remove(); calculateTotals(); } 
            else { colorSelect.value = ""; colorSelect.dispatchEvent(new Event('change')); }
        });

        orderLinesContainer.appendChild(row);
    }
    
    createRow();
</script>
